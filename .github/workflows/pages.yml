name: Publish Pulse-Vault docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "gui-go/cmd/cryptodemo/**"
      - "gui-go/crypto/**"
      - "gui-go/internal/crypto/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum

      - name: Prepare the docs site and local crypto demo
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: |
          site="$RUNNER_TEMP/pulse-vault-pages"
          mkdir -p "$site/crypto"
          cp -R docs/. "$site/"
          go build -trimpath -o "$site/crypto/pulse-vault-crypto.wasm" ./gui-go/cmd/cryptodemo
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "$site/crypto/wasm_exec.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/pulse-vault-pages

      - name: Deploy documentation site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
