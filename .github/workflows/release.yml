name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: pulse-vault
            asset_name: pulse-vault-linux
            ext: ''
          - os: windows-latest
            artifact_name: pulse-vault
            asset_name: pulse-vault-windows
            ext: '.exe'
          - os: macos-latest
            artifact_name: pulse-vault
            asset_name: pulse-vault-macos
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and build deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -e '.[dev]'

      - name: Build standalone executable
        run: |
          PYI_ARGS="--onefile --windowed --name ${{ matrix.artifact_name }} \
            --add-data \"src/pulsevault/assets${{ matrix.os == 'windows-latest' && ';' || ':' }}pulsevault/assets\" \
            --hidden-import customtkinter \
            --hidden-import tkinterdnd2 \
            --clean --noupx"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PYI_ARGS="$PYI_ARGS --version-file packaging/windows/version.txt"
          fi
          pyinstaller $PYI_ARGS src/pulsevault/main.py

          # macOS note: For a nicer .app bundle instead of raw onefile exe,
          # consider post-processing with 'pyinstaller ... --onedir' + create-dmg or appify.
          # Signing/notarization requires Apple Developer account + certs (see below).

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}${{ matrix.ext }}

      # Windows signing metadata is embedded via --version-file (CompanyName=DNSPulse etc.)
      # For full Authenticode signature (to show "Publisher: DNSPulse" and reduce SmartScreen warnings):
      # - Obtain a code signing certificate (preferably EV) from a trusted CA.
      # - In CI (advanced, use with care): store pfx as secret, use signtool.
      # Example (uncomment and configure secrets if you have a cert):
      # - name: Sign Windows binary (if cert available)
      #   if: matrix.os == 'windows-latest' && secrets.WINDOWS_CODE_SIGN_CERT
      #   shell: pwsh
      #   run: |
      #     $cert = [System.Convert]::FromBase64String('${{ secrets.WINDOWS_CODE_SIGN_CERT }}')
      #     [System.IO.File]::WriteAllBytes('cert.pfx', $cert)
      #     & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe' sign /f cert.pfx /p ${{ secrets.WINDOWS_CODE_SIGN_PASS }} /t http://timestamp.sectigo.com /fd sha256 /v dist/pulse-vault.exe

      # macOS desktop improvements:
      # - We currently ship a onefile executable (portable, works from anywhere).
      # - For a more "Mac-like" experience, you can turn it into a .app bundle.
      #   See packaging/macos/Info.plist.template for a starting point.
      #   Example after pyinstaller:
      #     mkdir -p dist/Pulse-Vault.app/Contents/MacOS
      #     cp dist/pulse-vault dist/Pulse-Vault.app/Contents/MacOS/Pulse-Vault
      #     cp -R src/pulsevault/assets dist/Pulse-Vault.app/Contents/Resources/
      #     cp packaging/macos/Info.plist.template dist/Pulse-Vault.app/Contents/Info.plist
      # - For distribution to other Macs you would codesign + notarize (Apple Developer account required).
      # We keep the simple onefile for now so it matches the Linux/Windows experience.
      # Future work can add a proper .dmg / .app in the release assets.

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip build
          pip install -e '.[dev]'
          pip install hypothesis

      - name: Run tests (fast profile)
        env:
          PULSEVAULT_SCRYPT_PROFILE: fast
          PULSEVAULT_TEST_FAST_KDF: "1"
        run: python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Run build verifier on source
        run: python packaging/verify-build.py --check-version --cli-smoke --gui-import-isolated

      - name: Extract changelog section for release notes
        id: changelog
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          python3 - << 'PYEOF'
          import re
          from pathlib import Path
          content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          ver = "${VERSION}".strip()
          patterns = [
              rf'## \[(?:v)?{re.escape(ver)}\].*?\n(.*?)(?=\n## \[|\Z)',
              r'## \[Unreleased\](.*?)(?=\n## \[|\Z)',
          ]
          body = ""
          for pat in patterns:
              m = re.search(pat, content, re.DOTALL | re.IGNORECASE)
              if m:
                  body = m.group(1).strip()
                  body = re.sub(r'^\s*\n+', '', body)
                  break
          if not body:
              body = "See full details in CHANGELOG.md."
          print("RELEASE_BODY<<EOF")
          print(body)
          print("EOF")
          PYEOF

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > SHA256SUMS.txt || true
          cd ..

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Prepare release assets (including advanced security property report and platform binaries)
        run: |
          mkdir -p release-assets
          cp -v dist/* release-assets/ 2>/dev/null || true
          cp -v release-binaries/* release-assets/ 2>/dev/null || true
          if [ -f ci-artifacts/pulse-vault-security-fuzz-report.json ]; then
            cp ci-artifacts/pulse-vault-security-fuzz-report.json release-assets/pulse-vault-${{ github.ref_name }}-security-fuzz-report.json
          fi
          cp -v SHA256SUMS.txt release-assets/ 2>/dev/null || true
          ls -l release-assets/ || true

      - name: Create GitHub Release (changelog-driven)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.RELEASE_BODY }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
