name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Product path: Go vault/crypto/UI/CLI suite (V5 product).
  go-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: gui-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: go.sum
      - name: Go test (crypto + vault + UI + CLI)
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/crypto ./internal/vault ./internal/ui ./cmd/pulse-vault -count=1

      - name: Packaging contract tests
        working-directory: ${{ github.workspace }}
        env:
          CGO_ENABLED: "0"
        run: go test ./packaging -count=1

      - name: Go public API tests and vet
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./crypto -count=1
          go vet ./crypto ./internal/crypto ./internal/vault ./internal/ui ./cmd/pulse-vault

      - name: Go race detector (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./crypto ./internal/crypto ./internal/vault ./cmd/pulse-vault -count=1

      - name: Go fuzz smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./crypto -run=^$ -fuzz=FuzzDecryptStreamV5NeverPanics -fuzztime=30s
          go test ./crypto -run=^$ -fuzz=FuzzDecryptStreamV4NeverPanics -fuzztime=15s

  # Packaging / App Store validation (Linux desktop metadata + AppStream)
  # Helps catch issues before Ubuntu App Store / Snap / .deb submissions.
  # Uses desktop-file-utils + appstream-util (AppStream GLib).
  # Runs independently of matrix (always on ubuntu-latest).
  validate-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install desktop + AppStream validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream-util || \
            sudo apt-get install -y desktop-file-utils libappstream-glib8 || true

      - name: Validate desktop file
        run: desktop-file-validate packaging/linux/pulse-vault.desktop

      - name: PyPI launcher tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run launcher unit tests
        working-directory: packaging/pypi
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Validate AppStream metainfo (relaxed, no net)
        run: |
          appstream-util validate-relax --nonet packaging/linux/io.github.z3r0s.PulseVault.metainfo.xml || \
            (echo "AppStream validation notes (common for early releases or missing screenshots)" && true)

      - name: Check version consistency hint (metainfo vs source)
        # Hint-only: never fail the job on mismatch.
        # Product version is ldflags-stamped from gui-go/internal/version at release.
        run: |
          echo "Go version default (gui-go/internal/version/version.go):"
          grep -n 'Version' gui-go/internal/version/version.go || true
          META_LINE=$(grep -o 'release version="[^"]*"' packaging/linux/io.github.z3r0s.PulseVault.metainfo.xml | head -1) || true
          echo "Metainfo latest release attr: ${META_LINE:-none found}"
          echo "Reminder: keep metainfo releases in sync with CHANGELOG.md (see CONTRIBUTING.md)"
