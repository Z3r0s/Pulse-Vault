name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        # macOS can be added later; core/CLI tests are cross-platform friendly thanks to mocks

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # [dev] includes hypothesis + GUI extras so gui smoke/theme tests can import customtkinter
          pip install -e '.[dev]'

      - name: Install system tkinter (Ubuntu, for optional real GUI smoke)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk || true

      - name: Run tests
        env:
          PULSEVAULT_SCRYPT_PROFILE: fast
          PULSEVAULT_TEST_FAST_KDF: "1"
        run: python -m unittest discover -s tests -v

      - name: Upload security fuzz / property test report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pulse-vault-security-fuzz-report-${{ matrix.python-version }}-${{ matrix.os }}
          path: ci-artifacts/pulse-vault-security-fuzz-report.json
          retention-days: 14
          if-no-files-found: warn

  # Packaging / App Store validation (Linux desktop metadata + AppStream)
  # Helps catch issues before Ubuntu App Store / Snap / .deb submissions.
  # Uses desktop-file-utils + appstream-util (AppStream GLib).
  # Runs independently of matrix (always on ubuntu-latest).
  validate-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install desktop + AppStream validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream-util || \
            sudo apt-get install -y desktop-file-utils libappstream-glib8 || true

      - name: Validate desktop file
        run: |
          desktop-file-validate packaging/linux/pulse-vault.desktop || (echo "Desktop validation failed (non-fatal in early dev)" && true)

      - name: Validate AppStream metainfo (relaxed, no net)
        run: |
          appstream-util validate-relax --nonet packaging/linux/io.github.z3r0s.PulseVault.metainfo.xml || \
            (echo "AppStream validation notes (common for early releases or missing screenshots)" && true)

      - name: Check version consistency hint (metainfo vs source)
        # Hint-only: never fail the job on mismatch or import issues.
        # Single-line python avoids YAML block-scalar pitfalls (unindented multi-line -c).
        run: |
          SRC_VER=$(PYTHONPATH=src python3 -c "import pulsevault; print(pulsevault.__version__)" 2>/dev/null) || SRC_VER="unknown"
          echo "Source version: $SRC_VER"
          META_LINE=$(grep -o 'release version="[^"]*"' packaging/linux/io.github.z3r0s.PulseVault.metainfo.xml | head -1) || true
          echo "Metainfo latest release attr: ${META_LINE:-none found}"
          EXPECTED="release version=\"${SRC_VER}\""
          if [ "$SRC_VER" != "unknown" ] && [ -n "$META_LINE" ] && [ "$META_LINE" != "$EXPECTED" ]; then
            echo "Hint: source __version__ ($SRC_VER) differs from metainfo ($META_LINE); keep in sync per CONTRIBUTING.md"
          fi
          echo "Reminder: keep metainfo releases in sync per CONTRIBUTING.md"
