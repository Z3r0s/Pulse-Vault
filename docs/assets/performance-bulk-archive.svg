<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 690"
     role="img" aria-labelledby="title desc" aria-label="Bulk archive lookup performance before and after indexing">
  <title id="title">Bulk archive lookup performance before and after indexing</title>
  <desc id="desc">1,000 × 4 KiB repeated with the standard password profile. Medians from 3 complete CLI runs. Verify: 0.914 seconds before and 0.335 seconds after (63.4% less time); Extract all: 5.564 seconds before and 4.326 seconds after (22.2% less time); Verify after delete: 0.794 seconds before and 0.308 seconds after (61.1% less time). Extract-all sampled peak RSS was 55.0 decimal MB before and 50.1 decimal MB after; RSS was sampled every 20 milliseconds.</desc>
  <rect width="100%" height="100%" fill="#0b1117"/>
  <text x="48.0" y="52.0" fill="#edf3f6" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Bulk verification and restore: before and after</text>
  <text x="48.0" y="84.0" fill="#a6b4bd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1,000 × 4 KiB repeated · standard password profile · median of 3 complete CLI runs</text>
  <text x="48.0" y="119.0" fill="#a6b4bd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Operation time · common 0–6 second scale</text>
