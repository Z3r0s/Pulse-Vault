  <title id="title">Sampled peak RSS by CLI operation</title>
  <desc id="desc">Line chart of approximate peak resident set size in decimal megabytes at each of seven CLI stages, including batch delete and a post-delete verification. Cyan is the repeated-data workload; blue is random data. Memory is sampled every 20 milliseconds, so short peaks can be missed.</desc>
