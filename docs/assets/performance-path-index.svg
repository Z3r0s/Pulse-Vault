<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490"
     role="img" aria-labelledby="title desc" aria-label="Bulk-add path conflict validation time">
  <title id="title">Bulk-add path conflict validation time</title>
  <desc id="desc">At 10,000 existing and 100 incoming paths, the former nested comparison took 23.74 milliseconds and a Unicode-aware folded-path index took 1.55 milliseconds. The index used 0.98 decimal MB, made 10,134 temporary allocations, and is released after add.</desc>
  <rect width="100%" height="100%" fill="#0b1117"/>
  <text x="46.0" y="52.0" fill="#edf3f6" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Bulk-add path conflict check</text>
  <text x="46.0" y="82.0" fill="#a6b4bd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">10,000 existing paths · 100 incoming paths · lower is faster</text>
  <line x1="320.0" y1="145.0" x2="320.0" y2="333.0" stroke="#30404b" stroke-width="1"/>
  <text x="320.0" y="358.0" fill="#8798a3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">0</text>
  <line x1="438.3" y1="145.0" x2="438.3" y2="333.0" stroke="#30404b" stroke-width="1"/>
  <text x="438.3" y="358.0" fill="#8798a3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">10</text>
  <line x1="556.7" y1="145.0" x2="556.7" y2="333.0" stroke="#30404b" stroke-width="1"/>
  <text x="556.7" y="358.0" fill="#8798a3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">20</text>
  <line x1="675.0" y1="145.0" x2="675.0" y2="333.0" stroke="#30404b" stroke-width="1"/>
  <text x="675.0" y="358.0" fill="#8798a3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">30</text>
  <line x1="793.3" y1="145.0" x2="793.3" y2="333.0" stroke="#30404b" stroke-width="1"/>
  <text x="793.3" y="358.0" fill="#8798a3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">40</text>
  <line x1="911.7" y1="145.0" x2="911.7" y2="333.0" stroke="#30404b" stroke-width="1"/>
  <text x="911.7" y="358.0" fill="#8798a3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">50</text>
  <line x1="1030.0" y1="145.0" x2="1030.0" y2="333.0" stroke="#30404b" stroke-width="1"/>
  <text x="1030.0" y="358.0" fill="#8798a3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">60</text>
  <text x="300.0" y="205.0" fill="#edf3f6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end">Nested scan</text>
  <rect x="320.0" y="187.0" width="280.9" height="24.0" rx="3" fill="#a7b3bc"/>
  <text x="614.9" y="205.0" fill="#edf3f6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">23.74 ms</text>
  <text x="300.0" y="297.0" fill="#edf3f6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end">Unicode-folded index</text>
  <rect x="320.0" y="279.0" width="18.4" height="24.0" rx="3" fill="#22d3d5"/>
  <text x="352.4" y="297.0" fill="#edf3f6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">1.55 ms</text>
  <text x="675.0" y="393.0" fill="#a6b4bd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Validation time (milliseconds)</text>
  <line x1="46.0" y1="419.0" x2="1154.0" y2="419.0" stroke="#30404b" stroke-width="1"/>
  <text x="46.0" y="457.0" fill="#22d3d5" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">About 15.3× faster</text>
  <text x="410.0" y="457.0" fill="#a6b4bd" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">0.98 MB · 10,134 allocations · released after add</text>
</svg>
