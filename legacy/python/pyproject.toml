# LEGACY ARCHIVE — not published, not CI
# Frozen Python/CustomTkinter implementation. Not a product, install path, or CI suite.
# Package-dir is relative to this folder only (legacy/python/).

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-vault"
# version is maintained in src/pulsevault/__init__.py (this archive folder only)
dynamic = ["version"]
description = "LEGACY — not the primary product. Pulse-Vault shipped product is the Go native GUI/CLI under gui-go/. This Python package is retired reference only (historical V5 vault code)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "DNSPulse / Z3r0s" }
]
keywords = ["encryption", "vault", "privacy", "desktop", "linux", "windows", "macos", "security", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
gui = [
  "customtkinter>=5.2.0",
  "tkinterdnd2>=0.3.0",
]
dev = [
  "hypothesis>=6.0.0",
  # GUI extras so unittest discover (gui smoke/theme) matches CI without a separate [gui] install
  "customtkinter>=5.2.0",
  "tkinterdnd2>=0.3.0",
]
# Note: tkinter is a system dependency (python3-tk on Linux, built-in on Windows/macOS).
# For full GUI runtime: pip install "pulse-vault[gui]"
# For CLI-only (headless/packaging): just pip install pulse-vault (no GUI deps)
# For development/tests: pip install -e ".[dev]"

[project.urls]
Homepage = "https://dnspulse.org"
Documentation = "https://github.com/Z3r0s/Pulse-Vault/blob/main/docs/THREAT_MODEL.md"
Repository = "https://github.com/Z3r0s/Pulse-Vault"
Issues = "https://github.com/Z3r0s/Pulse-Vault/issues"

[project.scripts]
pulse-vault = "pulsevault.main:main"
pulsevault = "pulsevault.main:main"
# Guided/headless CLI entry (recommended for servers/CI/packaging or when no display)
pulse-vault-cli = "pulsevault.cli:main_cli_entry"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pulsevault.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pulsevault = ["assets/*"]
